# Fly.io configuration. Change `app` and `primary_region` to match your Fly app (see README: Deploy).
app = "rolodex"
primary_region = "ewr"
console_command = "/rails/bin/rails console"

[build]

[env]
  APP_ORIGIN = "https://rolodex.example.com"
  SOLID_QUEUE_IN_PUMA = "true"
  RAILS_LOG_LEVEL = "info"

[[mounts]]
  source = "rolodex_data"
  destination = "/rails/storage"

[http_service]
  internal_port = 8080
  force_https = true
  # Stay running when idle so devices can sync at any time.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/up"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
